<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>QA mobile harness</title>
<style>
body{margin:0;background:#6f6f6f;font:12px/1.4 sans-serif;color:#fff}
.row{display:flex;gap:28px;padding:20px;align-items:flex-start}
.col{width:390px;flex:none}
.cap{margin:0 0 8px;letter-spacing:.04em}
iframe{width:390px;height:3200px;border:0;display:block;background:#faf8f4}
</style></head>
<body>
<div class="row">
  <div class="col"><p class="cap">390px — 명함</p><iframe id="f1" src="./index.html"></iframe></div>
  <div class="col"><p class="cap">390px — 편집 패널</p><iframe id="f2" src="./index.html"></iframe></div>
</div>
<script>
document.getElementById("f2").addEventListener("load", function(){
  try { var b = this.contentDocument.querySelector("[data-open]"); if (b) b.click(); } catch(e){}
});
</script>
</body></html>
